<!DOCTYPE html>
<html>
<head>
    <title>Food and Drinks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #cccccc;
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .product {
            margin: 10px 0;
            padding: 10px;
            background-color: #eeeeee;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #454b45;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #sku_output {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }

        #show {
            margin-top: 20px;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Food and Drinks</h1>

    <h2>Order Counter</h2>

    <label for="category">Category</label>
    <input type="text" id="category" placeholder="Example: Food">

    <label for="product_name">Product</label>
    <input type="text" id="product_name" placeholder="Example: Pizza">

    <label for="quantity">Stock Quantity</label>
    <input type="number" id="quantity" placeholder="Example: 20">

    <button id="generate">Generate SKU</button>

    <div id="sku_output">
        Total Cost
    </div>


    <h2>Order</h2>

    <div class="product">
        <input type="checkbox" id="Pizza" value="150">
        <label for="Pizza">Pizza - ₱150</label>
    </div>

    <div class="product">
        <input type="checkbox" id="Apples" value="80">
        <label for="Apples">Apples - ₱80</label>
    </div>

    <div class="product">
        <input type="checkbox" id="Soda" value="50">
        <label for="Soda">Soda - ₱50</label>
    </div>

    <div class="product">
        <input type="checkbox" id="Fries" value="70">
        <label for="Fries">Fries - ₱70</label>
    </div>

    <div class="product">
        <input type="checkbox" id="Burgers" value="120">
        <label for="Burgers">Burgers - ₱90</label>
