```html
<!DOCTYPE html>
<html>
<head>
    <title>Food and Drinks</title>

    <!-- PyScript -->
    <link rel="stylesheet"
        href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module"
        src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            padding: 30px;
        }

        .container {
            width: 500px;
            max-width: 100%;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0px 0px 10px #cccccc;
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #454b45;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #sku_output {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Food and Drinks</h1>
    <h2>SKU Generator</h2>

    <label for="category">Category</label>
    <input type="text" id="category"
           placeholder="Example: Food">

    <label for="product_name">Product</label>
    <input type="text" id="product_name"
           placeholder="Example: Pizza">

    <label for="quantity">Stock Quantity</label>
    <input type="number" id="quantity"
           placeholder="Example: 20" min="0" step="1">

    <button py-click="SKU_generator">Generate SKU</button>

    <div id="sku_output">Your SKU will appear here.</div>

    <script type="py">
from pyscript import document

def SKU_generator(e):
    category = document.getElementById("category").value.strip()
    product_name = document.getElementById("product_name").value.strip()
    stock = document.getElementById("quantity").value.strip()

    output = document.getElementById("sku_output")

    # Check if all fields are filled
    if not category or not product_name or not stock:
        output.innerText = "Please fill in all fields."
        return
    try:
        quantity = int(stock)
        if quantity < 0:
            output.innerText = "Stock cannot be negative."
            return
    except ValueError:
        output.innerText = "Enter a whole number for stock."
        return
    sku = (
        category[:3].upper()
        + "-"
        + product_name[:4].upper()
        + "-"
        + str(quantity)
    )

    output.innerText = "SKU: " + sku
    </script>

</div>

</body>
</html>
